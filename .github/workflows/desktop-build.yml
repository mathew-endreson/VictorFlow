name: Desktop build (Windows)

# Manual on purpose: this is a from-scratch pipeline for a Tauri shell that has never been compiled
# anywhere before (see project history — the dev machine is blocked by Windows Smart App Control). Trigger
# it by hand from the Actions tab until it's proven reliable; widen to push/tag triggers once it is.
on:
  workflow_dispatch: {}

jobs:
  build:
    # windows-latest ships Visual Studio Build Tools and a preinstalled rustup already targeting MSVC —
    # unaffected by the dev machine's Smart App Control block, which only exists on that one Windows 11
    # install. No workaround needed here; this is the plain, standard target.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Exact version, not just the major from .nvmrc: Node 24 is documented (README) to crash Jest on
          # Windows, so the build pipeline pins the same version proven to work rather than "any 22.x".
          node-version: 22.23.2
          cache: pnpm

      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Report toolchain versions
        run: |
          node -v
          pnpm -v
          rustc --version
          cargo --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages and the desktop frontend
        run: pnpm build

      - name: Stage embedded backend resources (Node, Postgres, server, migrations)
        # Populates apps/desktop/src-tauri/resources-staging/, which tauri.conf.json's bundle.resources
        # copies into the installed app next to the .exe. Never committed (see .gitignore) — rebuilt here
        # every run so it can't silently drift from the pinned Node/Postgres versions or a stale server build.
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "apps/desktop/src-tauri/resources-staging"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Portable Node runtime — the exact version pinned for local dev (README / .nvmrc), so the
          # bundled API runs on the same Node build that's actually been tested, not "whatever's on PATH".
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.23.2/node-v22.23.2-win-x64.zip" -OutFile "$env:RUNNER_TEMP\node.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\node.zip" -DestinationPath "$env:RUNNER_TEMP\node-extract" -Force
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\node-extract\node-v22.23.2-win-x64" "$stage\node"

          # Embedded PostgreSQL — the exact package/version scripts/local-postgres.mjs already pins for
          # dev, fetched at BUILD time here rather than by the installed app at first run (no internet
          # dependency for a customer reaching the login screen).
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\pgtools" | Out-Null
          Set-Content -Path "$env:RUNNER_TEMP\pgtools\package.json" -Value '{"name":"vf-pgtools","private":true}' -Encoding utf8
          Push-Location "$env:RUNNER_TEMP\pgtools"
          npm install embedded-postgres@16.14.0-beta.17 --no-audit --no-fund --loglevel=error
          Pop-Location
          $pgBin = Get-ChildItem -Recurse -Directory "$env:RUNNER_TEMP\pgtools\node_modules\@embedded-postgres" |
            Where-Object { $_.FullName -like "*native\bin" } | Select-Object -First 1
          if (-not $pgBin) { throw "embedded-postgres native/bin not found after npm install" }
          New-Item -ItemType Directory -Force -Path "$stage\pg\bin" | Out-Null
          Copy-Item -Recurse -Force "$($pgBin.FullName)\*" "$stage\pg\bin"

          # Migrations
          New-Item -ItemType Directory -Force -Path "$stage\migrations" | Out-Null
          Copy-Item "packages/db/migrations/*.sql" "$stage\migrations"

          # Launcher script (see conversation/memory for the port-fallback and identity-check design it implements)
          Copy-Item "apps/desktop/src-tauri/sidecar/launcher.mjs" "$stage\launcher.mjs"

          # Self-contained server: pnpm's workspace node_modules is full of symlinks back into the pnpm
          # store, meaningless once copied outside the monorepo — `pnpm deploy` resolves the real
          # dependency graph into a standalone tree. node-linker=hoisted (set for this one command only,
          # via env var, not a repo-wide .npmrc change) forces a plain flat node_modules with no internal
          # symlinks either, so the later Copy-Item and Tauri's own resource bundling can't mishandle one.
          if (Test-Path "$env:RUNNER_TEMP\server-deploy") { Remove-Item -Recurse -Force "$env:RUNNER_TEMP\server-deploy" }
          $env:npm_config_node_linker = "hoisted"
          pnpm --filter @victorflow/server deploy --prod "$env:RUNNER_TEMP\server-deploy"
          Remove-Item Env:\npm_config_node_linker
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\server-deploy" "$stage\server"

      - name: Build the Tauri desktop app (Windows installer)
        working-directory: apps/desktop
        # NSIS only: it's bundled by tauri-bundler itself (downloaded on demand), unlike the MSI target
        # which needs WiX Toolset present — restricting to one target keeps this pipeline's dependencies
        # to exactly what's needed, nothing assumed to already be on the runner beyond Rust + Node.
        run: pnpm run tauri build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: victorflow-desktop-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload raw executable (build debugging only — will NOT find its resources if run directly)
        # Only the installer lays the resources/ folder next to the exe at install time; this bare copy is
        # for inspecting the compiled binary itself, not for actually running the app. Use the installer.
        uses: actions/upload-artifact@v4
        with:
          name: victorflow-desktop-windows-exe-DO-NOT-RUN-DIRECTLY
          path: apps/desktop/src-tauri/target/release/victorflow-desktop.exe
          if-no-files-found: error
