name: Verify

# `pnpm verify` (typecheck → lint → all unit + e2e tests, stopping at the first failure) on every push.
# Separate from desktop-build.yml on purpose: that pipeline stays manual (workflow_dispatch) because it produces
# an installer; this one is the cheap correctness gate.
on:
  push: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Windows, like the dev machine and the only shipping target (the Tauri desktop app).
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The e2e and db tests create throw-away databases (<db>_test, <db>_dbtest) next to this one.
      DATABASE_URL: postgresql://victorflow:victorflow@localhost:5433/victorflow
      REDIS_ENABLED: 'false'
      QUEUE_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Exact version, same as desktop-build.yml: Node 24 is documented (README) to crash Jest on Windows.
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 16 and run pnpm verify
        # The repo's own Docker-free Postgres (scripts/local-postgres.mjs): embedded-postgres 16, initialised with
        # the user/password/database from DATABASE_URL and started with pg_ctl. Same step as verify so the
        # detached server is guaranteed to still be running when the tests need it.
        shell: bash
        run: pnpm db:local start && pnpm verify
