name: Server build (Windows)

# The VictorFlow Server installer for the shop's server computer: PostgreSQL 16, the API, the tracker and the TV displays
# as Windows services, with all data in one folder (apps/server-host). The desktop client is built by desktop-build.yml.
# Manual on purpose, like desktop-build.yml: start it from the Actions tab when an installer is needed.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and build the API, server-host and the tracker's packages
        # The tracker and the displays are built by the next step, see .github/actions/server-deps/action.yml for why.
        uses: ./.github/actions/server-deps

      - name: Stage the installer payload
        # Node 22.23.2 (checksum-verified), PostgreSQL 16, WinSW (pinned SHA-256), the VC++ runtime (signature-verified),
        # the deployed API, the standalone web apps (each started once to prove it runs), migrations, vf-server.
        run: node apps/server-host/scripts/stage.mjs --out "${{ runner.temp }}\vf-stage" --cache "${{ runner.temp }}\vf-stage-cache"

      - name: Install Inno Setup 6.7.1
        run: choco install innosetup --version=6.7.1 --no-progress -y --allow-downgrade

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DStageDir=$env:RUNNER_TEMP\vf-stage" "/DOutputDir=$env:GITHUB_WORKSPACE\dist-installer" apps\server-host\installer\victorflow-server.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: "Smoke test: install, services, health, sign-in, restart, reinstall, uninstall"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem dist-installer\VictorFlow-Server-Setup-*.exe | Select-Object -First 1).FullName
          $data = 'C:\VictorFlowData'
          $app = "$env:ProgramFiles\VictorFlow Server"
          $ids = 'VictorFlowPostgres', 'VictorFlowApi', 'VictorFlowTracker', 'VictorFlowDisplay'

          function Install([string]$log) {
            $p = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DATADIR=$data", "/LOG=$env:RUNNER_TEMP\$log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode) (100+ = vf-server setup failed: see $data\logs\setup.log)" }
          }
          function Wait-Healthy {
            for ($i = 0; $i -lt 60; $i++) {
              try { $h = Invoke-RestMethod http://127.0.0.1:3000/api/v1/health; if ($h.service -eq 'victorflow-api' -and $h.status -eq 'ok') { return } } catch {}
              Start-Sleep 2
            }
            throw 'the API did not become healthy'
          }

          Install 'install-1.log'
          foreach ($id in $ids) {
            $svc = Get-CimInstance Win32_Service -Filter "Name='$id'"
            if (-not $svc) { throw "$id is not installed" }
            if ($svc.State -ne 'Running') { throw "$id is $($svc.State)" }
            if ($svc.StartMode -ne 'Auto') { throw "$id starts $($svc.StartMode)" }
            if ($svc.StartName -notmatch 'NetworkService') { throw "$id runs as $($svc.StartName), not NetworkService" }
          }
          Wait-Healthy

          # the data folder: everything is there, and ordinary users cannot read the secrets
          foreach ($f in 'config.json', 'secrets.json', 'addresses.ini', 'first-login.txt', 'postgres\PG_VERSION', 'storage', 'logs\setup.log') {
            if (-not (Test-Path "$data\$f")) { throw "$data\$f is missing" }
          }
          $acl = (Get-Acl "$data\secrets.json").Access | ForEach-Object { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value }
          if ($acl -contains 'S-1-5-32-545' -or $acl -contains 'S-1-5-11') { throw "secrets.json is readable by Users: $acl" }

          # the seeded admin can sign in (proves argon2 loads under the service account)
          $secrets = Get-Content "$data\secrets.json" -Raw | ConvertFrom-Json
          $login = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3000/api/v1/auth/login -ContentType 'application/json' -Body (@{ email = 'admin@victorflow.local'; password = $secrets.adminPassword } | ConvertTo-Json)
          if (-not $login.accessToken) { throw 'admin sign-in failed' }

          # the tracker and the displays answer, and the API answers on the LAN address too
          foreach ($port in 3001, 3002) {
            $r = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw "port $port answered $($r.StatusCode)" }
          }
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          $lan = Invoke-RestMethod "http://${ip}:3000/api/v1/health"
          if ($lan.service -ne 'victorflow-api') { throw "no API on the LAN address $ip" }
          if (-not (Get-NetFirewallRule -DisplayName 'VictorFlow API (TCP 3000)' -ErrorAction SilentlyContinue)) { throw 'no firewall rule for the API' }

          # a restarted service comes back on its own; vf-server status agrees
          Restart-Service VictorFlowApi
          Wait-Healthy
          & "$app\vf-server.cmd" status
          if ($LASTEXITCODE -ne 0) { throw "vf-server status exit code $LASTEXITCODE" }

          # installing again (an upgrade) keeps the data and the secrets
          $before = (Get-FileHash "$data\secrets.json").Hash
          Install 'install-2.log'
          if ((Get-FileHash "$data\secrets.json").Hash -ne $before) { throw 'secrets.json changed on reinstall' }
          Wait-Healthy

          # uninstall: services and firewall rules go, the data folder stays
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\unins000.exe"); $i++) { Start-Sleep 2 } # the uninstaller re-launches itself from %TEMP%
          foreach ($id in $ids) { if (Get-Service $id -ErrorAction SilentlyContinue) { throw "$id is still installed" } }
          if (Get-NetFirewallRule -DisplayName 'VictorFlow * (TCP *)' -ErrorAction SilentlyContinue) { throw 'firewall rules were left behind' }
          if (-not (Test-Path "$data\postgres\PG_VERSION") -or -not (Test-Path "$data\secrets.json")) { throw 'the data folder was not kept' }
          Write-Host 'Smoke test passed.'

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke-logs | Out-Null
          Copy-Item "$env:RUNNER_TEMP\install-*.log" smoke-logs -ErrorAction SilentlyContinue
          Copy-Item C:\VictorFlowData\logs\* smoke-logs -ErrorAction SilentlyContinue
          Copy-Item C:\VictorFlowData\postgres\log\* smoke-logs -ErrorAction SilentlyContinue
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-smoke-logs
          path: smoke-logs
          if-no-files-found: warn

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: victorflow-server-windows-installer
          path: dist-installer/*.exe
          if-no-files-found: error
