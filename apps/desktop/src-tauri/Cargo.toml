[package]
name = "victorflow-desktop"
version = "0.1.0"
description = "VictorFlow desktop client (Tauri v2 shell around the React app)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "victorflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
