# Local infrastructure only — the apps run as plain local processes.
#   docker compose -f infrastructure/docker/docker-compose.yml up -d --wait
name: victorflow

services:
  postgres:
    image: postgres:16
    container_name: victorflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-victorflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-victorflow}
      POSTGRES_DB: ${POSTGRES_DB:-victorflow}
    ports:
      # loopback only: the API runs on this machine, and nothing else on the network should reach the database
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: victorflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # loopback only: this Redis has no password, so it must never be reachable from the network
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

volumes:
  pgdata:
  redisdata:
